server.port=8083
spring.application.name=telemetry-service

# Database Configuration (Logical ownership: telemetry)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:21011017}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - Validate against existing schema, do not drop or alter
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
kynexis.kafka.topics.machine-telemetry=${KYNEXIS_KAFKA_TOPIC_TELEMETRY:kynexis.machine-telemetry}

# Service URLs
kynexis.services.machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8088}

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.issuer=${JWT_ISSUER:kynexis}
jwt.audience=${JWT_AUDIENCE:kynexis-api}

# Internal service communication secret
kynexis.security.internal-secret=${INTERNAL_API_SECRET:KynexisInternalServiceCommunicationSecretKey2026}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
