server.port=8083
spring.application.name=telemetry-service-test

spring.datasource.url=jdbc:h2:mem:telemetry_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=localhost:9092
kynexis.kafka.topics.machine-telemetry=kynexis.machine-telemetry
kynexis.services.machine-service.url=http://localhost:8088

jwt.secret=SmartFactorySecretKeyForDevelopmentOnly123456789
jwt.expiration=3600000
