server.port=8086
spring.application.name=production-energy-service

# Database Configuration (Logical ownership: production, energy)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - Do not modify existing schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Downstream Service URLs
kynexis.services.plant-machine-service.url=http://localhost:8082
