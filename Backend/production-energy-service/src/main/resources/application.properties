server.port=8086
spring.application.name=production-energy-service

# Database Configuration (Logical ownership: production, energy)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - Do not modify existing schema
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.issuer=${JWT_ISSUER:kynexis}
jwt.audience=${JWT_AUDIENCE:kynexis-api}

# Internal service communication secret
kynexis.security.internal-secret=${INTERNAL_API_SECRET:KynexisInternalServiceCommunicationSecretKey2026}

# Downstream Service URLs
kynexis.services.plant-machine-service.url=${PLANT_MACHINE_SERVICE_URL:http://localhost:8082}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
