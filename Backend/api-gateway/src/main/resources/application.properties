server.port=8080
spring.application.name=api-gateway

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Downstream Microservices Routing URLs
kynexis.services.identity-service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
kynexis.services.plant-machine-service.url=${PLANT_MACHINE_SERVICE_URL:http://localhost:8082}
kynexis.services.telemetry-service.url=${TELEMETRY_SERVICE_URL:http://localhost:8083}
kynexis.services.alert-service.url=${ALERT_SERVICE_URL:http://localhost:8084}
kynexis.services.maintenance-service.url=${MAINTENANCE_SERVICE_URL:http://localhost:8085}
kynexis.services.production-energy-service.url=${PRODUCTION_ENERGY_SERVICE_URL:http://localhost:8086}
kynexis.services.dashboard-service.url=${DASHBOARD_SERVICE_URL:http://localhost:8087}

# JWT secret key matching identity service
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:kynexis}
jwt.audience=${JWT_AUDIENCE:kynexis-api}

# Internal service communication secret
kynexis.security.internal-secret=${INTERNAL_API_SECRET:KynexisInternalServiceCommunicationSecretKey2026}
