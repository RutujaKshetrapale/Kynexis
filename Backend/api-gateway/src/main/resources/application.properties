server.port=8080
spring.application.name=api-gateway

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Downstream Microservices Routing URLs (10 microservices)
kynexis.services.authentication-service.url=${AUTHENTICATION_SERVICE_URL:http://localhost:8081}
kynexis.services.plant-service.url=${PLANT_SERVICE_URL:http://localhost:8082}
kynexis.services.machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8088}
kynexis.services.sensor-service.url=${SENSOR_SERVICE_URL:http://localhost:8089}
kynexis.services.telemetry-service.url=${TELEMETRY_SERVICE_URL:http://localhost:8083}
kynexis.services.alert-service.url=${ALERT_SERVICE_URL:http://localhost:8084}
kynexis.services.maintenance-service.url=${MAINTENANCE_SERVICE_URL:http://localhost:8085}
kynexis.services.production-service.url=${PRODUCTION_SERVICE_URL:http://localhost:8086}
kynexis.services.energy-service.url=${ENERGY_SERVICE_URL:http://localhost:8087}

# JWT secret key matching authentication service
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:kynexis}
jwt.audience=${JWT_AUDIENCE:kynexis-api}

# Internal service communication secret
kynexis.security.internal-secret=${INTERNAL_API_SECRET:KynexisInternalServiceCommunicationSecretKey2026}
