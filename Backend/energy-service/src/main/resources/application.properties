server.port=8087
spring.application.name=energy-service

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_factory_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Internal Security
kynexis.security.internal-secret=${KYNEXIS_INTERNAL_SECRET:KynexisInternalServiceCommunicationSecretKey2026}

# Machine Service URL
kynexis.services.machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8088}
