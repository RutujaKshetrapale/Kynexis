server.port=${SERVER_PORT:8087}
spring.application.name=energy-service

# Database Configuration (MySQL 8.x)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_factory_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:21011017}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Internal Security
kynexis.security.internal-secret=${INTERNAL_API_SECRET:${KYNEXIS_INTERNAL_SECRET:KynexisInternalServiceCommunicationSecretKey2026}}
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}

# Machine Service URL
kynexis.services.machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8088}

