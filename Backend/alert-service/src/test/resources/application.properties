server.port=8084
spring.application.name=alert-service-test

spring.datasource.url=jdbc:h2:mem:alert_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=localhost:9092
kynexis.kafka.topics.machine-telemetry=kynexis.machine-telemetry
kynexis.kafka.topics.machine-alerts=kynexis.machine-alerts

kynexis.alert-engine.enabled=true
kynexis.alert-engine.temperature-high-enabled=true
kynexis.alert-engine.temperature-high-threshold=85.0
kynexis.alert-engine.temperature-high-severity=HIGH

jwt.secret=SmartFactorySecretKeyForDevelopmentOnly123456789
jwt.expiration=3600000
