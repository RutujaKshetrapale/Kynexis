spring.application.name=authentication-service
server.port=${SERVER_PORT:8081}

# Database Configuration (MySQL 8.x)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:21011017}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=86400000
jwt.issuer=kynexis
jwt.audience=kynexis-api

# Internal Communication Security
kynexis.security.internal-secret=${INTERNAL_API_SECRET:KynexisInternalServiceCommunicationSecretKey2026}

# Management & Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n
logging.level.com.kynexis.auth=INFO
