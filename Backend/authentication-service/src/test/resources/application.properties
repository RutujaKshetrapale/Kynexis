spring.application.name=authentication-service-test
server.port=0

spring.datasource.url=jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=SmartFactorySecretKeyForDevelopmentOnly123456789
jwt.expiration=86400000
jwt.issuer=kynexis
jwt.audience=kynexis-api

kynexis.security.internal-secret=KynexisInternalServiceCommunicationSecretKey2026
