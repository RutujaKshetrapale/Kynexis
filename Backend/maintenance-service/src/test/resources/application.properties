server.port=8085
spring.application.name=maintenance-service-test

spring.datasource.url=jdbc:h2:mem:maintenance_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

kynexis.services.plant-machine-service.url=http://localhost:8082
kynexis.services.telemetry-service.url=http://localhost:8083
kynexis.services.alert-service.url=http://localhost:8084

kynexis.machine-health.temperature-warning-threshold=80.0
kynexis.machine-health.temperature-critical-threshold=85.0
kynexis.predictive-maintenance.trend-readings-limit=50
kynexis.predictive-maintenance.stale-telemetry-hours=24

jwt.secret=SmartFactorySecretKeyForDevelopmentOnly123456789
jwt.expiration=3600000
