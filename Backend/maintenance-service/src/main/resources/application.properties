server.port=8085
spring.application.name=maintenance-service

# Database Configuration (Logical ownership: maintenance)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - Validate against existing schema, do not drop or alter
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Peer Service URLs
kynexis.services.machine-service.url=${MACHINE_SERVICE_URL:http://localhost:8088}
kynexis.services.telemetry-service.url=${TELEMETRY_SERVICE_URL:http://localhost:8083}
kynexis.services.alert-service.url=${ALERT_SERVICE_URL:http://localhost:8084}

# Health & Predictive Maintenance Defaults
kynexis.machine-health.temperature-warning-threshold=80.0
kynexis.machine-health.temperature-critical-threshold=85.0
kynexis.predictive-maintenance.trend-readings-limit=50
kynexis.predictive-maintenance.stale-telemetry-hours=24

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.issuer=${JWT_ISSUER:kynexis}
jwt.audience=${JWT_AUDIENCE:kynexis-api}

# Internal service communication secret
kynexis.security.internal-secret=${INTERNAL_API_SECRET:KynexisInternalServiceCommunicationSecretKey2026}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
