server.port=8087
spring.application.name=dashboard-service

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

# Downstream Service URLs
kynexis.services.plant-machine-service.url=${PLANT_MACHINE_SERVICE_URL:http://localhost:8082}
kynexis.services.alert-service.url=${ALERT_SERVICE_URL:http://localhost:8084}
kynexis.services.production-energy-service.url=${PRODUCTION_ENERGY_SERVICE_URL:http://localhost:8086}

# Redis & Caching Configuration (Phase 19 Monolith Parity)
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.client-type=lettuce

kynexis.cache.enabled=true
kynexis.cache.environment=${APP_ENV:dev}
kynexis.cache.prefix=kynexis
kynexis.cache.default-ttl-seconds=15
kynexis.cache.dashboard-summary-ttl-seconds=15
kynexis.cache.dashboard-machine-status-ttl-seconds=15

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.issuer=${JWT_ISSUER:kynexis}
jwt.audience=${JWT_AUDIENCE:kynexis-api}

# Internal service communication secret
kynexis.security.internal-secret=${INTERNAL_API_SECRET:KynexisInternalServiceCommunicationSecretKey2026}
