spring.application.name=SpringBoot-Factory-Application

server.port=8080

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ============================================================
# FLYWAY MIGRATION MANAGEMENT
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial database baseline
spring.flyway.locations=classpath:db/migration

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
# CONNECTION POOL
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=3600000

# ============================================================
# LOGGING & OBSERVABILITY FOUNDATION
# ============================================================

logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-N/A}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-N/A}] %logger{36} - %msg%n

logging.file.name=logs/kynexis.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# ============================================================
# SPRING BOOT ACTUATOR & APPLICATION HEALTH
# ============================================================

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

management.info.env.enabled=true

info.app.name=KYNEXIS
info.app.description=Connected Industrial Intelligence
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=21
info.app.spring-boot.version=4.0.7

# ============================================================
# AUTOMATED ALERT ENGINE CONFIGURATION
# ============================================================

kynexis.alert-engine.enabled=true

# Explicitly supported rule (V2 seed data: "Spindle temperature exceeded 85°C safety threshold")
kynexis.alert-engine.temperature-high-enabled=true
kynexis.alert-engine.temperature-high-threshold=85.0
kynexis.alert-engine.temperature-high-severity=HIGH

# Explicitly supported rule (DomainValidationService machine status validation: OFFLINE, STOPPED, MAINTENANCE)
kynexis.alert-engine.machine-status-enabled=true

# Unverified safety limits — disabled by default until approved by domain authority
kynexis.alert-engine.temperature-low-enabled=false
kynexis.alert-engine.temperature-low-threshold=0.0
kynexis.alert-engine.temperature-low-severity=MEDIUM

kynexis.alert-engine.vibration-high-enabled=false
kynexis.alert-engine.vibration-high-threshold=5.0
kynexis.alert-engine.vibration-high-severity=MEDIUM

kynexis.alert-engine.pressure-high-enabled=false
kynexis.alert-engine.pressure-high-threshold=100.0
kynexis.alert-engine.pressure-high-severity=HIGH

kynexis.alert-engine.pressure-low-enabled=false
kynexis.alert-engine.pressure-low-threshold=10.0
kynexis.alert-engine.pressure-low-severity=MEDIUM

kynexis.alert-engine.rpm-high-enabled=false
kynexis.alert-engine.rpm-high-threshold=3500.0
kynexis.alert-engine.rpm-high-severity=HIGH

# ============================================================
# MACHINE HEALTH ENGINE CONFIGURATION
# ============================================================

kynexis.health-engine.low-alert-causes-degraded=false

# ============================================================
# PREDICTIVE MAINTENANCE ENGINE CONFIGURATION (PHASE 18)
# ============================================================

kynexis.predictive-maintenance.min-telemetry-readings=3
kynexis.predictive-maintenance.stale-threshold-hours=24
kynexis.predictive-maintenance.trend-readings-limit=10
kynexis.predictive-maintenance.trend-window-days=7
kynexis.predictive-maintenance.temp-rise-threshold=5.0
kynexis.predictive-maintenance.vibration-rise-threshold=1.5
kynexis.predictive-maintenance.pressure-drift-threshold=20.0
kynexis.predictive-maintenance.rpm-drift-threshold=300.0

# ============================================================
# REDIS & CACHING CONFIGURATION (PHASE 19)
# ============================================================

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.client-type=lettuce

kynexis.cache.enabled=true
kynexis.cache.environment=${APP_ENV:dev}
kynexis.cache.prefix=kynexis
kynexis.cache.default-ttl-seconds=15
kynexis.cache.dashboard-summary-ttl-seconds=15
kynexis.cache.dashboard-machine-status-ttl-seconds=15

# ============================================================
# APACHE KAFKA EVENT STREAMING CONFIGURATION (PHASE 20)
# ============================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=${KAFKA_PRODUCER_ACKS:all}
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:3}
spring.kafka.producer.properties.enable.idempotence=${KAFKA_PRODUCER_IDEMPOTENCE:true}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
spring.kafka.producer.properties.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:1000}

kynexis.kafka.enabled=${KYNEXIS_KAFKA_ENABLED:true}
kynexis.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kynexis.kafka.acks=${KAFKA_PRODUCER_ACKS:all}
kynexis.kafka.retries=${KAFKA_PRODUCER_RETRIES:3}
kynexis.kafka.delivery-timeout-ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kynexis.kafka.request-timeout-ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
kynexis.kafka.retry-backoff-ms=${KAFKA_RETRY_BACKOFF_MS:1000}
kynexis.kafka.enable-idempotence=${KAFKA_PRODUCER_IDEMPOTENCE:true}
kynexis.kafka.topics.machine-telemetry=${KAFKA_TOPIC_TELEMETRY:kynexis.machine-telemetry}
kynexis.kafka.topics.machine-alerts=${KAFKA_TOPIC_ALERTS:kynexis.machine-alerts}

management.health.kafka.enabled=${MANAGEMENT_HEALTH_KAFKA_ENABLED:false}