spring.application.name=SpringBoot-Factory-Application

server.port=8080

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# ============================================================
# CONNECTION POOL
# ============================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JWT
# ============================================================

jwt.secret=SmartFactorySecretKeyForDevelopmentOnly123456789

jwt.expiration=3600000