spring.application.name=SpringBoot-Factory-Application

server.port=8080

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
# CONNECTION POOL
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET:SmartFactorySecretKeyForDevelopmentOnly123456789}
jwt.expiration=3600000

# ============================================================
# LOGGING & OBSERVABILITY FOUNDATION
# ============================================================

logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-N/A}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-N/A}] %logger{36} - %msg%n

logging.file.name=logs/kynexis.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# ============================================================
# SPRING BOOT ACTUATOR & APPLICATION HEALTH
# ============================================================

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

management.info.env.enabled=true

info.app.name=KYNEXIS
info.app.description=Connected Industrial Intelligence
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=21
info.app.spring-boot.version=4.0.7