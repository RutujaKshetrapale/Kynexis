spring.application.name=SpringBoot-Factory-Application-Test

# Database - In-Memory H2 for Test Isolation
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# Flyway Configuration for Test Isolation
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.target=1

# JPA / Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.test.database.replace=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Secret for Testing
jwt.secret=SmartFactoryTestSecretKeyForDevelopmentOnly123456789
jwt.expiration=3600000

# ============================================================
# SPRING BOOT ACTUATOR & APPLICATION HEALTH
# ============================================================

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

management.info.env.enabled=true

info.app.name=KYNEXIS
info.app.description=Connected Industrial Intelligence
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=21
info.app.spring-boot.version=4.0.7
