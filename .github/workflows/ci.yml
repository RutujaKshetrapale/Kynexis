name: KYNEXIS CI Pipeline

on:
  push:
    branches:
      - main
      - 'phase-**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'phase-**'

jobs:
  backend-build-and-test:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Maven and Java Environment
        run: |
          java -version
          mvn -v

      - name: Compile All 10 Microservices
        run: mvn clean test-compile --file Backend/pom.xml --batch-mode

      - name: Execute Microservice Unit Tests
        run: mvn test --file Backend/pom.xml --batch-mode

      - name: Package Microservices JARs
        run: mvn package -DskipTests --file Backend/pom.xml --batch-mode

  docker-and-config-validation:
    name: Docker & Database Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Validate Database Schema Safety
        run: |
          echo "Validating schema.sql does not contain destructive DROP TABLE statements..."
          if grep -i "DROP TABLE" Database/mysql/schema.sql; then
            echo "ERROR: Destructive DROP TABLE found in schema.sql!"
            exit 1
          fi
          echo "Validating seed_data.sql does not contain destructive TRUNCATE TABLE statements..."
          if grep -i "TRUNCATE TABLE" Database/mysql/seed_data.sql; then
            echo "ERROR: Destructive TRUNCATE TABLE found in seed_data.sql!"
            exit 1
          fi
          echo "Database safety checks PASSED."
