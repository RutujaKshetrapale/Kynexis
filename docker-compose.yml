      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      MACHINE_SERVICE_URL: http://machine-service:8088
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
      machine-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  telemetry-service:
    build:
      context: ./Backend/telemetry-service
    container_name: kynexis-telemetry-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MACHINE_SERVICE_URL: http://machine-service:8088
      SENSOR_SERVICE_URL: http://sensor-service:8089
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      machine-service:
        condition: service_started
      sensor-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  alert-service:
