services:
  # ============================================================
  # Infrastructure Services
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: kynexis-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: smart_factory_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Database/mysql/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  redis:
    image: redis:7-alpine
    container_name: kynexis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kynexis-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: kynexis-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - kynexis-network

  # ============================================================
  # Application Microservices
  # ============================================================
  identity-service:
    build:
      context: ./Backend/identity-service
    container_name: kynexis-identity-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  plant-machine-service:
    build:
      context: ./Backend/plant-machine-service
    container_name: kynexis-plant-machine-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  telemetry-service:
    build:
      context: ./Backend/telemetry-service
    container_name: kynexis-telemetry-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PLANT_MACHINE_SERVICE_URL: http://plant-machine-service:8082
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      plant-machine-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  alert-service:
    build:
      context: ./Backend/alert-service
    container_name: kynexis-alert-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  maintenance-service:
    build:
      context: ./Backend/maintenance-service
    container_name: kynexis-maintenance-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      PLANT_MACHINE_SERVICE_URL: http://plant-machine-service:8082
      TELEMETRY_SERVICE_URL: http://telemetry-service:8083
      ALERT_SERVICE_URL: http://alert-service:8084
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
      plant-machine-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      alert-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  production-energy-service:
    build:
      context: ./Backend/production-energy-service
    container_name: kynexis-production-energy-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      PLANT_MACHINE_SERVICE_URL: http://plant-machine-service:8082
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      mysql:
        condition: service_healthy
      plant-machine-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  dashboard-service:
    build:
      context: ./Backend/dashboard-service
    container_name: kynexis-dashboard-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PLANT_MACHINE_SERVICE_URL: http://plant-machine-service:8082
      ALERT_SERVICE_URL: http://alert-service:8084
      PRODUCTION_ENERGY_SERVICE_URL: http://production-energy-service:8086
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      redis:
        condition: service_healthy
      plant-machine-service:
        condition: service_started
      alert-service:
        condition: service_started
      production-energy-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  api-gateway:
    build:
      context: ./Backend/api-gateway
    container_name: kynexis-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PLANT_MACHINE_SERVICE_URL: http://plant-machine-service:8082
      TELEMETRY_SERVICE_URL: http://telemetry-service:8083
      ALERT_SERVICE_URL: http://alert-service:8084
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8085
      PRODUCTION_ENERGY_SERVICE_URL: http://production-energy-service:8086
      DASHBOARD_SERVICE_URL: http://dashboard-service:8087
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
    depends_on:
      identity-service:
        condition: service_started
      plant-machine-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      alert-service:
        condition: service_started
      maintenance-service:
        condition: service_started
      production-energy-service:
        condition: service_started
      dashboard-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kynexis-network

  # ============================================================
  # Legacy Monolith (Retained for migration baseline on port 8090)
  # ============================================================
  legacy-monolith:
    build:
      context: ./Backend/SpringBoot-Factory-Application
    container_name: kynexis-legacy-monolith
    profiles: ["legacy"]
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_factory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kynexis-network

# ============================================================
# Networks & Persistent Volumes
# ============================================================
networks:
  kynexis-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data:
