  api-gateway:
    build:
      context: ./Backend/api-gateway
    container_name: kynexis-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTHENTICATION_SERVICE_URL: http://authentication-service:8081
      PLANT_SERVICE_URL: http://plant-service:8082
      MACHINE_SERVICE_URL: http://machine-service:8088
      SENSOR_SERVICE_URL: http://sensor-service:8089
      TELEMETRY_SERVICE_URL: http://telemetry-service:8083
      ALERT_SERVICE_URL: http://alert-service:8084
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8085
      PRODUCTION_SERVICE_URL: http://production-service:8086
      ENERGY_SERVICE_URL: http://energy-service:8087
      JWT_SECRET: ${JWT_SECRET:-SmartFactorySecretKeyForDevelopmentOnly123456789}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-KynexisInternalServiceCommunicationSecretKey2026}
